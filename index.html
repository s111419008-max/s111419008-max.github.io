<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期末成果網頁</title>
    <style>
        /* 基本頁面樣式 */
        body {
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-family: 'Segoe UI', '微軟正黑體', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 讓內容不要被貼齊上方 */
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.4rem;
            margin: 0;
            letter-spacing: 1px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        p.lead {
            margin-top: 0.6rem;
            opacity: 0.95;
            background: rgba(0,0,0,0.18);
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            font-size: 0.95rem;
        }

        /* 作品格子 */
        .portfolio {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
            align-items: stretch;
            margin-top: 1.5rem;
            /* 讓 main 區域推開 footer（使 footer 在頁面底部） */
            flex: 1 0 auto;
        }

        .card {
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            transition: transform 200ms ease, box-shadow 200ms ease;
            display: flex;
            flex-direction: column;
            min-height: 320px;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
        }

        .card a {
            color: inherit;
            text-decoration: none;
            display: block;
            height: 100%;
        }

        .thumb {
            width: 100%;
            height: 0;
            padding-bottom: 56%;
            position: relative;
            background: #222;
        }

        .thumb img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .caption {
            padding: 0.9rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-top: auto;
            background: linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.02));
        }

        .title {
            font-weight: 700;
            font-size: 1.05rem;
            color: #fff;
        }

        .desc {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.85);
        }

        .visit {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #ffdfe9;
            background: linear-gradient(90deg,#ff758c,#ff7eb3);
            padding: 0.45rem 0.65rem;
            display: inline-block;
            border-radius: 8px;
        }

        /* footer 樣式 */
        footer.site-footer {
            width: 100%;
            max-width: 1100px;
            margin-top: 2rem;
            padding: 1rem 1.25rem;
            color: rgba(255,255,255,0.9);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            background: rgba(0,0,0,0.08);
            border-radius: 10px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.18);
        }

        footer .left {
            display: flex;
            flex-direction: column;
        }

        footer .links a {
            color: #ffdfe9;
            text-decoration: none;
            margin-left: 0.6rem;
        }

        footer .links a:hover {
            text-decoration: underline;
        }

        /* 響應式調整 */
        @media (max-width: 560px) {
            body { padding: 1rem; }
            h1 { font-size: 1.6rem; }
            footer.site-footer { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
        }
    </style>
</head>
